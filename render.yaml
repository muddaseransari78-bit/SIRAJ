# Render "Blueprint" (Phase 23): New + -> Blueprint -> pick your GitHub repo. Render creates the backend for you.
# You only fill the values marked sync:false. The JWT secrets are generated by Render (different, long).
services:
  - type: web
    name: siraj-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false            # paste your MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false            # your frontend address, e.g. https://siraj.vercel.app (no trailing slash)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SAMESITE
        value: lax             # the site reaches this API through its own /api address (Vercel rewrite), so the cookie is first-party: Safari/iPhone keeps people logged in
      - key: TRUST_PROXY
        value: "2"             # two proxies sit in front of the API (Vercel, then Render): 2 makes rate limits see the real visitor
      # Phase 31 - background prayer reminders (make the keys with: cd backend ; npm run vapid)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false            # mailto:you@example.com
      # Phase 38 - Google / Apple sign-in (optional; the button shows only when the id is set). See DEPLOYMENT.md
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 90d             # a visitor who came back within 90 days stays logged in
      - key: CRON_SECRET
        generateValue: true    # used by the free timer that keeps the server awake (see PHASE31-CHECKLIST.md)
