# nginx for the SIRAJ frontend container (Phase 23).
# The security headers below are the SAME as vercel.json and public/_headers (a test checks this).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers: security-headers.inc is made from the template at start-up. It is included in every
    # location because nginx drops parent headers when a location adds its own.

    # Built files have a hash in their name: cache for a year
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Phase 36: theme pictures, logo and hero video (30 days). nginx serves video in parts (range requests) by itself.
    location /media/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # The service worker must always be re-checked so updates arrive
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-page app: /quran/2 must open index.html
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
